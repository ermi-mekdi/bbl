<!DOCTYPE html>
<html lang="ti">
  <head>
    <title>መዝገበ ቃላት</title>
    <link rel="stylesheet" type="text/css" href="../stylesheet.css" />
    <link rel="icon" type="image/x-icon" href="../assets/faviacts.jpg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    
    
  </head>
  <body>
    <div class="bo">
      <div class="list">
        <div class="ppl">
          <h2>ቃላት</h2>
          <form>
            <input id="searchInput" type="text" placeholder="ዝተደልየ ቃል..."> <button id="searchButton" type="button">ድለ</button>
          </form>
          <div class="js-pplList">   </div>
        </div>
        <div class="detaile">
          <h2>ትርጉም</h2>
          <div class="js-pplDetail"></div>

        </div>
      </div>
    </div>
    
    </div>
    <script>
      const wrdListEl = document.querySelector('.js-pplList');
      const detailEl = document.querySelector('.js-pplDetail');
      let wrdArray = []; // Declare outside for access in search

      function disWrd(wrd) {
        const q = wrd.id
        const t = wrd.d
        detailEl.innerHTML = `
        <h4> ${q} </h4>
        <h4> ${t} </h4>
        
        `;
        console.log('Displaying details for:', wrd);
      }
      
      fetch('../data/nword.json')
        .then(r => r.json())
        .then(data => {
          wrdArray = Array.isArray(data) ? data : Object.values(data);
          renderList(wrdArray);          
          console.log('Word data loaded:', data);
        })
        .catch(err => {
          console.error('Unable to load word data', err);
        });

      function renderList(list) {
        wrdListEl.innerHTML = '';
        list.forEach(wrd => {
          if (!wrd) return;
          const li = document.createElement('li');
          li.style.cursor = 'pointer';
          li.textContent = wrd ? ` ${wrd.id}` : 'Unknown';
          li.addEventListener('click', () => {
            disWrd(wrd);
          });
          wrdListEl.appendChild(li);
        });
      }

      

        
      ////Search

      const searchInput = document.getElementById('searchInput');
      const searchButton = document.getElementById('searchButton');


      function performSearch() {
        const query = searchInput.value.toLowerCase().trim();
        if (query === '') {
          renderList(wrdArray);
        } else {
          const filtered = wrdArray.filter(wrd => {
            if (!wrd) return false;
            const name1 = (wrd.id || '').toLowerCase();
            
            
            return name1.includes(query) 
          });
          renderList(filtered);
        }
        detailEl.innerHTML = '';
      }

      searchButton.addEventListener('click', performSearch);
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          performSearch();
        }
      });
    </script>
    

  </body>
</html>
